<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#059669" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>تطبيق مقدم الخدمة | SmartLine</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    body{font-family:'Cairo',sans-serif;background:#0f172a;color:#f8fafc}
    @keyframes flashNeon{0%,100%{background:linear-gradient(135deg,#ff0055,#ff6600);transform:scale(1)}50%{background:linear-gradient(135deg,#facc15,#ef4444);transform:scale(1.01)}}
    .neon-card{animation:flashNeon 0.8s infinite;border:3px solid #fff}
  </style>
</head>
<body class="min-h-screen pb-12">

  <!-- عنصر صوت حقيقي لضمان استمرار رنين الإنذار حتى لو المتصفح في الخلفية -->
  <audio id="bgAlarmAudio" loop preload="auto"></audio>

  <div class="bg-slate-950 border-b border-slate-800 text-xs py-2.5 px-4">
    <div class="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-2">
      <span id="connStatus" class="font-bold text-emerald-400">جاري الاتصال ...</span>
      <div class="flex flex-wrap gap-2">
        <button id="enableBgAlertBtn" type="button" class="bg-amber-500 text-slate-950 font-extrabold px-3 py-1 rounded-lg">🔔 تفعيل إنذار وإشعارات الخلفية</button>
        <button id="scTopBtn" type="button" class="bg-emerald-600 text-white font-bold px-3 py-1 rounded-lg">📲 إضافة أيقونة للشاشة</button>
      </div>
    </div>
  </div>

  <div class="max-w-5xl mx-auto px-4 pt-5">
    <!-- التسجيل -->
    <section id="pRegSec" class="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-lg mx-auto space-y-4">
      <h1 class="text-xl font-extrabold text-emerald-400">تسجيل بيانات مقدم الخدمة</h1>
      <form id="pForm" class="space-y-4">
        <input id="pName" type="text" required placeholder="اسم مقدم الخدمة *" class="w-full rounded-xl bg-slate-800 border border-slate-700 p-3 text-sm text-white" />
        <input id="pPhone" type="tel" required placeholder="رقم التليفون *" class="w-full rounded-xl bg-slate-800 border border-slate-700 p-3 text-sm text-white" />
        <div class="grid grid-cols-2 gap-3">
          <label class="cursor-pointer"><input type="radio" name="pSpec" value="Tooling" checked class="peer sr-only"/><div class="p-3 rounded-xl border-2 border-slate-700 bg-slate-800 text-center peer-checked:border-orange-500 font-extrabold">🔧 Tooling</div></label>
          <label class="cursor-pointer"><input type="radio" name="pSpec" value="Process" class="peer sr-only"/><div class="p-3 rounded-xl border-2 border-slate-700 bg-slate-800 text-center peer-checked:border-purple-500 font-extrabold">⚙️ Process</div></label>
        </div>
        <button type="submit" class="w-full bg-emerald-600 text-white font-extrabold py-3 rounded-xl">حفظ وتفعيل استقبال البلاغات</button>
      </form>
    </section>

    <!-- لوحة مقدم الخدمة -->
    <section id="pMainSec" class="hidden space-y-5">
      <div class="bg-emerald-800/60 border border-emerald-600 rounded-2xl p-3.5 flex flex-wrap items-center justify-between gap-2 text-xs">
        <span>📲 <strong>ضع أيقونة التطبيق على الشاشة الرئيسية</strong> وفعّل إشعارات الخلفية ليصلك صوت الإنذار فوراً حتى لو الشاشة مغلقة.</span>
        <button id="scBannerBtn" type="button" class="bg-white text-slate-900 font-extrabold px-3.5 py-1.5 rounded-xl">➕ تثبيت الأيقونة</button>
      </div>

      <header class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h2 id="pHdrName" class="text-lg font-extrabold"></h2>
          <p id="pHdrInfo" class="text-xs text-slate-400"></p>
        </div>
        <div class="flex flex-wrap gap-2">
          <button id="xlsxBtn" type="button" class="bg-emerald-600 text-white font-bold text-xs px-3.5 py-2 rounded-xl">📊 تصدير Excel</button>
          <button id="pEditBtn" type="button" class="bg-slate-800 text-amber-300 font-bold text-xs px-3 py-2 rounded-xl">✏️ تعديل</button>
          <button id="pLogoutBtn" type="button" class="bg-rose-950 text-rose-300 font-bold text-xs px-3 py-2 rounded-xl">🚪 خروج</button>
        </div>
      </header>

      <div class="space-y-3">
        <div class="flex justify-between items-center">
          <h3 class="font-extrabold text-base">🚨 الطلبات الواردة لقسمك (<span id="incCount">0</span>)</h3>
          <button id="muteNowBtn" type="button" class="hidden bg-white text-rose-700 font-extrabold text-xs px-3 py-1 rounded-lg">🔇 كتم الصوت الحالي</button>
        </div>
        <div id="incBox" class="space-y-3"></div>
      </div>

      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
        <h3 class="font-extrabold text-base border-b border-slate-800 pb-2">🛠️ المهام المقبولة والجاري العمل عليها</h3>
        <div id="actBox" class="space-y-3"></div>
      </div>

      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
        <h3 class="font-extrabold text-base border-b border-slate-800 pb-2">✅ سجل الحالات المحلولة</h3>
        <div class="overflow-x-auto">
          <table class="w-full text-right text-xs">
            <thead class="bg-slate-800 text-slate-300"><tr><th class="p-2">المرجع</th><th class="p-2">الكود</th><th class="p-2">العميل</th><th class="p-2">المشكلة</th><th class="p-2">ما تم عمله</th><th class="p-2">التقييم والتعليق</th></tr></thead>
            <tbody id="doneBody" class="divide-y divide-slate-800"></tbody>
          </table>
        </div>
      </div>
    </section>
  </div>

  <script>
    const DB_URL = "https://smartlinealert-default-rtdb.asia-southeast1.firebasedatabase.app/";
    const ROOM = "smartline_main";
    const KEY = "smartline_provider_v3";

    // توليد ملف WAV صوتي للإنذار يعمل داخل <audio> حتى في الخلفية
    function buildSirenWavDataUri() {
      const sampleRate = 8000, seconds = 1, numSamples = sampleRate * seconds;
      const buf = new ArrayBuffer(44 + numSamples * 2), view = new DataView(buf);
      const writeStr = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
      writeStr(0, 'RIFF'); view.setUint32(4, 36 + numSamples * 2, true); writeStr(8, 'WAVEfmt ');
      view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true); view.setUint16(34, 16, true); writeStr(36, 'data');
      view.setUint32(40, numSamples * 2, true);
      for (let i = 0; i < numSamples; i++) {
        const freq = i < numSamples / 2 ? 920 : 1360;
        const val = Math.sin(2 * Math.PI * freq * (i / sampleRate));
        view.setInt16(44 + i * 2, val * 22000, true);
      }
      let bin = ''; const bytes = new Uint8Array(buf);
      for (let i = 0; i < bytes.byteLength; i++) bin += String.fromCharCode(bytes[i]);
      return 'data:audio/wav;base64,' + btoa(bin);
    }

    const bgAudio = document.getElementById('bgAlarmAudio');
    bgAudio.src = buildSirenWavDataUri();

    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; });

    async function enableBackgroundCapabilities() {
      try { bgAudio.play().then(() => { bgAudio.pause(); bgAudio.currentTime = 0; }).catch(()=>{}); } catch(e){}
      if ('Notification' in window && Notification.permission !== 'granted') {
        await Notification.requestPermission();
      }
      if ('wakeLock' in navigator) {
        try { await navigator.wakeLock.request('screen'); } catch(e){}
      }
      document.getElementById('enableBgAlertBtn').textContent = '✅ إنذار الخلفية والإشعارات مفعل';
    }

    let profile = JSON.parse(localStorage.getItem(KEY) || 'null');
    let tickets = {};
    let silenced = new Set();
    let notifiedTicketIds = new Set();

    const app = !firebase.apps.length ? firebase.initializeApp({ databaseURL: DB_URL }) : firebase.app();
    const rootRef = firebase.database(app).ref('smartline_system/' + ROOM);

    function logEvent(type, summary) {
      const id = 'ev_' + Date.now();
      rootRef.child('events/' + id).set({ id, timestamp: Date.now(), timeStr: new Date().toLocaleString('ar-EG'), type, summary });
    }

    function isRinging(t) {
      if (t.status !== 'pending' || silenced.has(t.id)) return false;
      return Date.now() < (t.alarmExpiresAt || ((t.timestamp || Date.now()) + 60000));
    }

    function sendSystemNotification(t) {
      if (notifiedTicketIds.has(t.id)) return;
      notifiedTicketIds.add(t.id);
      if ('vibrate' in navigator) navigator.vibrate([500, 200, 500, 200, 500]);
      if ('Notification' in window && Notification.permission === 'granted') {
        try {
          new Notification(`🚨 عطل جديد (${t.targetDept}) - ${t.ticketCode}`, {
            body: `المكان: ${t.clientLine} | العميل: ${t.clientName} | المشكلة: ${t.title} (${t.machine})`,
            requireInteraction: true
          });
        } catch (e) {}
      }
    }

    rootRef.child('tickets').on('value', (s) => {
      tickets = s.val() || {};
      document.getElementById('connStatus').textContent = '🟢 متصل ';
      renderProvider();
    });

    setInterval(() => {
      if (!profile) return;
      const pend = Object.values(tickets).filter(t => t.targetDept === profile.specialty && t.status === 'pending');
      pend.forEach(t => sendSystemNotification(t));
      const anyActiveAlarm = pend.some(t => isRinging(t));
      if (anyActiveAlarm) {
        document.getElementById('muteNowBtn').classList.remove('hidden');
        if (bgAudio.paused) bgAudio.play().catch(()=>{});
      } else {
        document.getElementById('muteNowBtn').classList.add('hidden');
        if (!bgAudio.paused) { bgAudio.pause(); bgAudio.currentTime = 0; }
      }
      pend.forEach(t => {
        const el = document.getElementById('rem_' + t.id);
        if (el) {
          const rem = Math.max(0, Math.ceil(((t.alarmExpiresAt || (t.timestamp + 60000)) - Date.now()) / 1000));
          el.textContent = rem > 0 && !silenced.has(t.id) ? `🔊 يرن (${rem} ثانية للصامت)` : '🔕 صامت (انتهت الدقيقة)';
        }
      });
    }, 1000);

    function showProviderView(edit = false) {
      if (!profile || edit) {
        pRegSec.classList.remove('hidden'); pMainSec.classList.add('hidden');
      } else {
        pRegSec.classList.add('hidden'); pMainSec.classList.remove('hidden');
        pHdrName.textContent = `👷 ${profile.name} — مختص ${profile.specialty}`;
        pHdrInfo.textContent = `📞 ${profile.phone}`;
        renderProvider();
      }
    }

    function renderProvider() {
      if (!profile) return;
      const deptList = Object.values(tickets).filter(t => t.targetDept === profile.specialty).sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));
      const pend = deptList.filter(t => t.status === 'pending');
      const act = deptList.filter(t => (t.status === 'open' || t.status === 'in_progress') && t.providerName === profile.name);
      const done = deptList.filter(t => t.status === 'resolved');

      incCount.textContent = pend.length;
      incBox.innerHTML = !pend.length
        ? `<div class="p-5 text-center text-slate-500 bg-slate-900 rounded-2xl border border-slate-800 text-xs">لا توجد طلبات معلقة لقسم ${profile.specialty}</div>`
        : pend.map(t => `
          <div class="${isRinging(t) ? 'neon-card' : 'bg-amber-400 border-2 border-white'} rounded-2xl p-4 text-slate-950 flex flex-col sm:flex-row justify-between gap-3">
            <div class="space-y-1 text-xs">
              <div class="flex gap-2 items-center">
                <span class="bg-slate-950 text-yellow-300 font-mono font-black px-2.5 py-0.5 rounded">${t.ticketCode}</span>
                <span id="rem_${t.id}" class="bg-rose-700 text-white font-bold px-2.5 py-0.5 rounded">🔊 يرن</span>
              </div>
              <p class="font-black text-sm">📍 المكان: ${t.clientLine} | ${t.clientDept} | ${t.clientFactory}</p>
              <p class="font-bold">👤 العميل: ${t.clientName} — ⚠️ الشكوى: <span class="text-rose-800 font-black">${t.title}</span> — ⚙️ المعدة: ${t.machine}</p>
            </div>
            <div class="flex gap-2 items-center">
              <button type="button" data-act="accept" data-id="${t.id}" class="bg-emerald-600 text-white font-black px-5 py-2.5 rounded-xl border-2 border-white">✅ اقبل</button>
              <button type="button" data-act="reject" data-id="${t.id}" class="bg-slate-950 text-white font-bold px-4 py-2.5 rounded-xl">❌ ارفض</button>
            </div>
          </div>
        `).join('');

      actBox.innerHTML = !act.length
        ? `<p class="text-center text-slate-500 text-xs py-4">لا توجد مهام جارية</p>`
        : act.map(t => `
          <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-2 text-xs">
            <div class="flex justify-between font-bold"><span class="text-amber-300 font-mono">${t.ticketCode}</span><span>${t.statusLabel}</span></div>
            <p>📍 ${t.clientLine} (${t.clientName} - 📞 ${t.clientPhone}) | ⚠️ ${t.title} (${t.machine})</p>
            <p class="bg-slate-900 p-2 rounded">الوصف: ${t.description}</p>
            <textarea id="res_${t.id}" rows="2" placeholder="ما تم عمله لحل المشكلة..." class="w-full rounded-xl bg-slate-900 border border-slate-600 p-2 text-white">${t.resolutionNotes || ''}</textarea>
            <div class="flex gap-2">
              ${t.status !== 'in_progress' ? `<button type="button" data-act="start" data-id="${t.id}" class="bg-indigo-600 text-white font-bold px-4 py-2 rounded-xl">▶️ بدء الإصلاح</button>` : ''}
              <button type="button" data-act="done" data-id="${t.id}" class="bg-emerald-600 text-white font-bold px-4 py-2 rounded-xl">✅ المهمة تمت</button>
            </div>
          </div>
        `).join('');

      doneBody.innerHTML = done.map(t => `
        <tr>
          <td class="p-2 font-mono text-emerald-400">${t.referenceNumber || ''}</td>
          <td class="p-2 font-mono text-amber-300">${t.ticketCode}</td>
          <td class="p-2">${t.clientName}</td>
          <td class="p-2">${t.title}</td>
          <td class="p-2 text-emerald-300">${t.resolutionNotes}</td>
          <td class="p-2 text-amber-400 font-bold">${t.rating ? `★ (${t.rating}/5)` : ''} ${t.ratingComment ? `<span class="block text-slate-300 text-[11px]">💬 ${t.ratingComment}</span>` : ''}</td>
        </tr>
      `).join('');
    }

    pForm.addEventListener('submit', (e) => {
      e.preventDefault();
      enableBackgroundCapabilities();
      const spec = document.querySelector('input[name="pSpec"]:checked').value;
      const phone = pPhone.value.trim().replace(/[.#$\[\]]/g, '_');
      profile = { id: 'prov_' + phone, name: pName.value.trim(), phone, specialty: spec, registeredAt: new Date().toLocaleString('ar-EG') };
      localStorage.setItem(KEY, JSON.stringify(profile));
      rootRef.child('providers/' + profile.id).update(profile);
      logEvent('PROVIDER_REGISTERED', `سجّل الفني "${profile.name}" (${spec})`);
      showProviderView(false);
    });

    document.getElementById('enableBgAlertBtn').addEventListener('click', enableBackgroundCapabilities);
    document.getElementById('pEditBtn').addEventListener('click', () => showProviderView(true));
    document.getElementById('pLogoutBtn').addEventListener('click', () => { localStorage.removeItem(KEY); profile = null; showProviderView(false); });
    document.getElementById('muteNowBtn').addEventListener('click', () => {
      Object.values(tickets).forEach(t => { if (t.status === 'pending') silenced.add(t.id); });
      bgAudio.pause();
    });

    incBox.addEventListener('click', (e) => {
      const b = e.target.closest('[data-act]'); if (!b) return;
      const id = b.getAttribute('data-id'), act = b.getAttribute('data-act'), t = tickets[id];
      if (!t || t.status !== 'pending') return;
      if (act === 'accept') {
        rootRef.child('tickets/' + id).update({ status: 'open', statusLabel: 'مفتوحة', providerName: profile.name, providerPhone: profile.phone });
        logEvent('ACCEPTED', `قبل "${profile.name}" الطلب (${t.ticketCode})`);
      } else {
        rootRef.child('tickets/' + id).update({ status: 'rejected', statusLabel: 'تم رفض الطلب', providerName: profile.name, providerPhone: profile.phone });
        logEvent('REJECTED', `رفض "${profile.name}" الطلب (${t.ticketCode})`);
      }
    });

    actBox.addEventListener('click', (e) => {
      const b = e.target.closest('[data-act]'); if (!b) return;
      const id = b.getAttribute('data-id'), act = b.getAttribute('data-act'), t = tickets[id];
      if (act === 'start') {
        rootRef.child('tickets/' + id).update({ status: 'in_progress', statusLabel: 'جاري العمل عليها' });
      } else if (act === 'done') {
        const notes = document.getElementById('res_' + id).value.trim(); if (!notes) return;
        const ref = 'REF-' + Math.floor(100000 + Math.random() * 900000);
        rootRef.child('tickets/' + id).update({ status: 'resolved', statusLabel: 'تم الحل', resolutionNotes: notes, referenceNumber: ref, resolvedAt: new Date().toLocaleString('ar-EG') });
        logEvent('RESOLVED', `أنهى "${profile.name}" الطلب (${t.ticketCode}) برقم (${ref})`);
      }
    });

    document.getElementById('xlsxBtn').addEventListener('click', () => {
      const rows = Object.values(tickets).map(t => ({
        'المرجع': t.referenceNumber || '', 'الكود': t.ticketCode, 'القسم': t.targetDept, 'الحالة': t.statusLabel,
        'العميل': t.clientName, 'المشكلة': t.title, 'المعدة': t.machine, 'الفني': t.providerName,
        'ما تم عمله': t.resolutionNotes, 'التقييم': t.rating || '', 'تعليق العميل': t.ratingComment || ''
      }));
      if (!rows.length) return;
      const ws = XLSX.utils.json_to_sheet(rows), wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'الحالات'); XLSX.writeFile(wb, 'Report.xlsx');
    });

    showProviderView(false);
  </script>
</body>
</html>
